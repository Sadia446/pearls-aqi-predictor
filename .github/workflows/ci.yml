name: CI

# Fast sanity check on every push/PR: dependencies install and all modules
# compile. Catches syntax/import breakage before the scheduled jobs run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r api/requirements.txt
      - name: Byte-compile all modules
        run: python -m compileall ml api
      - name: Import the API (catches broken routes/imports)
        run: python -c "from api.main import app; print(len(app.routes), 'routes')"
